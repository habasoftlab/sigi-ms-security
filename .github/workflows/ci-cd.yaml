name: CI/CD Pipeline - ms-security

on:
  push:
    branches:
      - develop
      - testing
      - main

jobs:
  # ==========================================
  # FASE 1: INTEGRACIÓN CONTINUA (CI) & TESTS
  # ==========================================
  build-and-test:
    runs-on: self-hosted
    
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Compilar y ejecutar pruebas unitarias (JUnit)
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          echo "DB_PASSWORD=${DB_PASSWORD}" > .env
          echo "JWT_SECRET=${JWT_SECRET}" >> .env
          mvn clean verify -e

      - name: Guardar artefacto (JAR)
        uses: actions/upload-artifact@v4
        with:
          name: ms-security-jar
          path: target/ms-security-0.0.1-SNAPSHOT.jar

  # ==========================================
  # FASE 2: DESPLIEGUE CONTINUO EN VPS (CD)
  # ==========================================
  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing')
    needs: build-and-test
    runs-on: self-hosted
    
    steps:
      - name: Checkout del código en el servidor
        uses: actions/checkout@v4

      - name: Descargar artefacto compilado
        uses: actions/download-artifact@v4
        with:
          name: ms-security-jar
          path: target/

      - name: Construir y Levantar Docker (Producción)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" > .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          docker compose -f docker-compose.prod.yaml down || true
          docker build -t ${{ github.event.repository.name }}:latest .
          docker compose -f docker-compose.prod.yaml up -d --build ms-security
          docker system prune -f
      
      - name: Construir y Levantar Docker (Testing)
        if: github.ref == 'refs/heads/testing'
        run: |
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" > .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          docker compose -f docker-compose.test.yaml down || true
          docker build -t ${{ github.event.repository.name }}:test .
          docker compose -f docker-compose.test.yaml up -d --build ms-security